    <script>
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Window.prototype || {}, 'fetch');
          if (desc && !desc.set) {
            var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if cannot be redefined
        }
      })();
    </script>
